enabled: true
server-id: parkour
node-mode: RELAY
host-server: parkour

network:
  enabled: true
  allowed-origins: [spawn, survival, parkour]
  queue-entry-seconds: 300
  reservation-seconds: 45
  heartbeat-seconds: 5
  heartbeat-stale-seconds: 20
  transfer-on-reservation: true
  return-to-origin: true

locale:
  default: ru
  use-client-locale: true

ui:
  sounds: true
  particles: true
  bossbar: true
  scoreboard: true
  # Optional animated ItemDisplay layer. Keep disabled on gameplay nodes so
  # map loot uses the lighter visible server-authoritative dropped item.
  loot-displays: false
  # Paper Dialog API (1.21.6+ clients) for overview/help/admin screens.
  # Item-dense screens and older clients always use the chest GUI.
  dialogs-enabled: false
  filler: {material: GRAY_STAINED_GLASS_PANE, custom-model-data: 0}
  # Shared 32x32 arc:left_gray navigation control.
  back: {material: BLUE_STAINED_GLASS_PANE, custom-model-data: 11013}

ttt:
  minimum-players: 4
  maximum-players: 16
  preparation-seconds: 30
  countdown-seconds: 8
  round-seconds: 600
  post-round-seconds: 12
  traitor-player-ratio: 4
  detective-minimum-players: 6
  traitor-credits: 2
  detective-credits: 1
  body-despawn-seconds: 600

weapons:
  enabled: true
  dna-seconds: 90
  visuals:
    flintlock: {material: IRON_HORSE_ARMOR, custom-model-data: 0}
    revolver: {material: IRON_HORSE_ARMOR, custom-model-data: 0}
    hand_cannon: {material: BLAZE_ROD, custom-model-data: 0}
    double_barrel: {material: CROSSBOW, custom-model-data: 0}
    five_seven: {material: GOLDEN_HORSE_ARMOR, custom-model-data: 0}
    g36: {material: NETHERITE_HOE, custom-model-data: 0}
    aek_971: {material: NETHERITE_HOE, custom-model-data: 0}
    rpl_20: {material: NETHERITE_HOE, custom-model-data: 0}
    vepr_12: {material: CROSSBOW, custom-model-data: 0}
    m1_garand: {material: NETHERITE_SHOVEL, custom-model-data: 0}
    vss_vintorez: {material: NETHERITE_SHOVEL, custom-model-data: 0}
    mcmillan: {material: NETHERITE_SHOVEL, custom-model-data: 0}
  # Optional animated resource-pack beam rendered under each loot display.
  # Production profiles bind these slots to lemon_vfxdrop model IDs.
  loot-effect:
    enabled: false
    material: POTION
    common-custom-model-data: 0
    uncommon-custom-model-data: 0
    rare-custom-model-data: 0
    epic-custom-model-data: 0
    legendary-custom-model-data: 0
    height: 0.08
    scale: 0.9

# A host refuses queue reservations until the arena is enabled and every
# location is valid. Coordinates below are intentionally non-operational.
arena:
  enabled: false
  world: pvp
  # Optional built-in map. citadel-v1 is created only on a HOST when this
  # arena is explicitly enabled and the dedicated world does not exist.
  template: ''
  lobby: ''
  spectator: ''
  minimum: ''
  maximum: ''
  spawns: []

debug:
  enabled: false
  # Mutating scenario commands fail closed outside these exact network ids.
  allowed-server-ids: [lab]
