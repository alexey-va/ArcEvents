enabled: true
server-id: parkour
node-mode: RELAY
host-server: parkour

network:
  enabled: true
  allowed-origins: [spawn, survival, parkour]
  queue-entry-seconds: 300
  reservation-seconds: 45
  heartbeat-seconds: 5
  heartbeat-stale-seconds: 20
  transfer-on-reservation: true
  return-to-origin: true

# Queue ownership is deterministic: the earliest queued player is the event
# creator. These controls are read live and can be changed with /events reload.
event-controls:
  creator-controls-enabled: true
  creator-arena-selection-enabled: true
  admin-override-enabled: true

# Used when the event creator starts a round without choosing a map.
# Leave empty to keep deterministic automatic rotation.
default-arena: ''

# Safe live gameplay tuning. In-progress timers keep their captured deadline;
# new actions and the next match use the latest values.
gameplay:
  # The original inventory is committed to durable recovery before this runs.
  # Disable only for a future mode that intentionally keeps player inventory.
  clear-inventory: true
  spawn-return-seconds: 10
  spawn-return-movement-tolerance: 0.05
  radar-duration-seconds: 30
  preparation-rations: 4
  medkit-healing: 8.0
  role-shop:
    traitor-blade-cost: 2
    traitor-radar-cost: 1
    traitor-smoke-cost: 1
    detective-scanner-cost: 1
    detective-medkit-cost: 1
    detective-armor-cost: 1
  pickup-ammo-magazines: 3
  pickup-ammo-minimum: 12
  pickup-ammo-maximum: 48
  pickup-delay-ticks: 20
  headshot-multiplier: 1.5
  preparing-tip-seconds: 4

smoke:
  throw-velocity: 1.15
  radius: 5.5
  duration-seconds: 8
  tick-interval-ticks: 5
  blindness-refresh-ticks: 35
  darkness-refresh-ticks: 28
  smoke-particles: 34
  ash-particles: 18

arena-runtime:
  view-distance: 6
  simulation-distance: 4
  # Imported armor stands, frames and banners are stripped on startup. Native
  # display entities are inert and may be retained for authored map details.
  # The cap is a startup sanitation boundary and therefore restart-only.
  imported-decorations:
    preserve-displays: true
    max-displays: 256

locale:
  default: ru
  use-client-locale: true

chat:
  # Ordinary round chat is spatial. The sender always sees their own line;
  # other living players (or other spectators) hear it only inside this range.
  # All values are applied immediately by /events reload.
  local:
    enabled: true
    close-distance: 8.0
    normal-distance: 24.0
    maximum-distance: 36.0
  # Paper chat/viewer isolation is always active during a match. This optional
  # layer also suppresses external player, disguised and system-chat packets.
  # Requires a ProtocolLib build compatible with the exact Minecraft version.
  packet-isolation:
    enabled: false

ui:
  sounds: true
  particles: true
  bossbar: true
  scoreboard: true
  # Animated ItemDisplay presentation over the server-authoritative pickup.
  # Imported map entities are removed separately and never survive arena load.
  loot-displays: true
  loot-display:
    height: 0.18
    scale: 0.78
    view-range: 0.75
    animation-step-ticks: 5
    rotation-ticks: 40
    particle-interval-ticks: 10
  # Paper Dialog API (1.21.6+ clients) for overview/help/admin screens.
  # Item-dense screens and older clients always use the chest GUI.
  dialogs-enabled: false
  # Runtime-editable TextDisplay rows above participants. The text itself is
  # read from lang/<locale>.yml -> nameplate.lines.
  nameplates:
    enabled: true
    reconcile-period-ticks: 2
    max-distance: 32.0
    line-width: 180
    view-range: 0.5
    scale: 0.95
    vertical-offset: 0.55
    shadowed: false
    background: {alpha: 80, red: 11, green: 15, blue: 18}
    hide-invisible-targets: true
    hide-spectator-targets: true
    require-line-of-sight: true
    # Normalized look-direction dot product. -1 disables camera-cone culling;
    # 0.5 keeps targets within roughly 60 degrees of the screen center.
    minimum-view-alignment: 0.5
    layers:
      health-priority: 200
      summary-priority: 100
  filler: {material: GRAY_STAINED_GLASS_PANE, custom-model-data: 0}
  # Shared 32x32 arc:left_gray navigation control.
  back: {material: BLUE_STAINED_GLASS_PANE, custom-model-data: 11013}
  # Item id is derived from the locale name key plus the state material. This
  # keeps ready/unavailable variants independently configurable.
  menu-items:
    main-ttt-spyglass: {material: SPYGLASS}
    main-stats-writable-book: {material: WRITABLE_BOOK}
    main-help-knowledge-book: {material: KNOWLEDGE_BOOK}
    main-admin-command-block: {material: COMMAND_BLOCK}
    event-overview-spyglass: {material: SPYGLASS}
    event-queue-clock: {material: CLOCK}
    event-join-lime-dye: {material: LIME_DYE}
    event-join-unavailable-gray-dye: {material: GRAY_DYE}
    event-leave-red-dye: {material: RED_DYE}
    event-start-lime-concrete: {material: LIME_CONCRETE}
    event-start-gray-concrete: {material: GRAY_CONCRETE}
    event-arena-filled-map: {material: FILLED_MAP}
    event-roster-player-head: {material: PLAYER_HEAD}
    event-shop-nether-star: {material: NETHER_STAR}
    event-report-written-book: {material: WRITTEN_BOOK}
    event-help-knowledge-book: {material: KNOWLEDGE_BOOK}
    event-evacuate-ender-pearl: {material: ENDER_PEARL}
    stats-summary-writable-book: {material: WRITABLE_BOOK}
    help-innocent-emerald: {material: EMERALD}
    help-traitor-redstone: {material: REDSTONE}
    help-detective-lapis-lazuli: {material: LAPIS_LAZULI}
    help-flow-clock: {material: CLOCK}
    help-evidence-player-head: {material: PLAYER_HEAD}
    help-weapons-crossbow: {material: CROSSBOW}
    help-controls-command-block: {material: COMMAND_BLOCK}
    admin-status-observer: {material: OBSERVER}
    admin-arenas-filled-map: {material: FILLED_MAP}
    admin-start-lime-concrete: {material: LIME_CONCRETE}
    admin-stop-red-concrete: {material: RED_CONCRETE}
    admin-reload-clock: {material: CLOCK}
    admin-recover-totem-of-undying: {material: TOTEM_OF_UNDYING}
    arenas-entry-lime-concrete: {material: LIME_CONCRETE}
    arenas-entry-filled-map: {material: FILLED_MAP}
    arenas-auto-lime-concrete: {material: LIME_CONCRETE}
    arenas-auto-compass: {material: COMPASS}
    event-arenas-entry-lime-concrete: {material: LIME_CONCRETE}
    event-arenas-entry-filled-map: {material: FILLED_MAP}
    event-arenas-auto-lime-concrete: {material: LIME_CONCRETE}
    event-arenas-auto-compass: {material: COMPASS}
    shop-credits-sunflower: {material: SUNFLOWER}
    shop-unavailable-gray-dye: {material: GRAY_DYE}
    roster-player-player-head: {material: PLAYER_HEAD}
    body-victim-player-head: {material: PLAYER_HEAD}
    body-time-clock: {material: CLOCK}
    body-cause-target: {material: TARGET}
    body-dna-compass: {material: COMPASS}
    body-dna-lost-gray-dye: {material: GRAY_DYE}
    body-called-light-blue-dye: {material: LIGHT_BLUE_DYE}
    body-call-bell: {material: BELL}
    body-roster-player-head: {material: PLAYER_HEAD}
    report-summary-emerald: {material: EMERALD}
    report-summary-redstone: {material: REDSTONE}
    report-player-player-head: {material: PLAYER_HEAD}
    report-combat-writable-book: {material: WRITABLE_BOOK}
    combat-entry-red-dye: {material: RED_DYE}
    combat-entry-wither-skeleton-skull: {material: WITHER_SKELETON_SKULL}
    combat-entry-paper: {material: PAPER}
    common-previous-arrow: {material: ARROW}
    common-next-arrow: {material: ARROW}
  # Chest GUI topology. Code addresses semantic ids only; the complete candidate
  # is rejected on a missing id, overlap, invalid slot or undersized region.
  layouts:
    main:
      schema-version: 1
      rows: 3
      elements:
        ttt: {slot: 4}
        statistics: {slot: 18}
        help: {slot: 22}
        admin: {slot: 26}
    help:
      schema-version: 1
      rows: 5
      elements:
        innocent: {slot: 11}
        traitor: {slot: 13}
        detective: {slot: 15}
        flow: {slot: 22}
        evidence: {slot: 29}
        weapons: {slot: 31}
        controls: {slot: 33}
        back: {slot: 36}
    ttt:
      schema-version: 1
      rows: 5
      elements:
        overview: {slot: 13}
        left: {slot: 20}
        center: {slot: 22}
        right: {slot: 24}
        arena: {slot: 29}
        help: {slot: 31}
        back: {slot: 36}
        evacuate: {slot: 40}
    statistics:
      schema-version: 1
      rows: 3
      elements:
        summary: {slot: 13}
        back: {slot: 18}
    admin:
      schema-version: 1
      rows: 6
      elements:
        status: {slot: 13}
        arenas: {slot: 20}
        start: {slot: 29}
        stop: {slot: 31}
        reload: {slot: 33}
        recover: {slot: 40}
        back: {slot: 45}
    arenas:
      schema-version: 1
      rows: 6
      elements:
        auto: {slot: 40}
        back: {slot: 45}
      regions:
        arenas: {slots: [10, 12, 14, 16, 28, 30, 32, 34]}
    shop:
      schema-version: 1
      rows: 5
      elements:
        credits: {slot: 4}
        back: {slot: 36}
      regions:
        offers: {slots: [20, 22, 24]}
    roster:
      schema-version: 1
      rows: 6
      elements:
        back: {slot: 45}
      regions:
        players: {slots: ['10-16', '19-25', '28-34']}
    body:
      schema-version: 1
      rows: 5
      elements:
        victim: {slot: 13}
        time: {slot: 20}
        cause: {slot: 22}
        dna: {slot: 24}
        call: {slot: 31}
        roster: {slot: 33}
        back: {slot: 36}
    report:
      schema-version: 1
      rows: 6
      elements:
        summary: {slot: 4}
        combat: {slot: 40}
        back: {slot: 45}
      regions:
        participants: {slots: [10, 11, 12, 13, 14, 15, 16, 19, 20, 21, 22, 23, 24, 25, 29, 33]}
    combat:
      schema-version: 1
      rows: 6
      elements:
        back: {slot: 45}
        previous: {slot: 48}
        next: {slot: 50}
      regions:
        entries: {slots: ['10-16', '19-25', '28-34']}

ttt:
  minimum-players: 4
  maximum-players: 16
  preparation-seconds: 30
  countdown-seconds: 8
  round-seconds: 600
  post-round-seconds: 12
  traitor-player-ratio: 4
  detective-minimum-players: 6
  traitor-credits: 2
  detective-credits: 1
  body-despawn-seconds: 600

