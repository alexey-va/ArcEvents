name: ArcEvents
version: '${version}'
main: ru.ruscrafting.events.paper.ArcEventsPlugin
api-version: '1.21.11'
authors: [RusCrafting]
description: Cross-server custom events for RusCrafting
depend: [ARC, packetevents]
softdepend: [LuckPerms, WorldEdit, WorldGuard, ViaVersion, ItemsAdder]
commands:
  arcevents:
    description: RusCrafting events
    usage: /arcevents
    permission: arcevents.play
permissions:
  arcevents.play:
    default: true
  arcevents.start:
    description: Start a ready public event roster from any network node
    default: false
  arcevents.teamchat:
    default: true
  arcevents.admin:
    default: op
  arcevents.debug:
    default: op
  arcevents.qa:
    default: op
  arcevents.scope-preview:
    description: Preview known weapon sights outside events on host or relay nodes
    default: op
