name: ArcEvents
version: '${version}'
main: ru.ruscrafting.events.paper.ArcEventsPlugin
api-version: '1.21.11'
authors: [RusCrafting]
description: Cross-server custom events for RusCrafting
softdepend: [WorldEdit, WorldGuard, ViaVersion, ProtocolLib]
loadbefore: [My_Worlds]
commands:
  arcevents:
    description: RusCrafting events
    usage: /arcevents
    permission: arcevents.play
permissions:
  arcevents.play:
    default: true
  arcevents.start:
    description: Start a ready public event roster from any network node
    default: false
  arcevents.teamchat:
    default: true
  arcevents.admin:
    default: op
  arcevents.debug:
    default: op
  arcevents.qa:
    default: op
