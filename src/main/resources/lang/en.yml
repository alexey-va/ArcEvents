      - '<#92bed8>Click<#f2f0e6> to make this the next map'
    auto-name: '<#e3b341><bold>Automatic rotation'
    auto-lore:
      - '<#f2f0e6>Choose a ready map from the pool for every match.'
      - '<#8c8c8c>The match id makes the choice reproducible.'
  event-arenas:
    title: '<#20252b>Next-Round Map'
    entry-name: '<arena>'
    entry-lore:
      - '<#8c8c8c>Selection: <selection>'
      - ''
      - '<#8c8c8c>[<#92bed8>▶<#8c8c8c>] <#92bed8>Click<#f2f0e6> — choose'
    auto-name: '<#e3b341>Automatic rotation'
    auto-lore:
