    traitor-blade-name: '<#d84a4a><bold>Single-use knife'
    traitor-blade-lore:
      - '<#f2f0e6>Instantly eliminates a player on hit.'
      - '<#f2f0e6>Disappears after a successful strike.'
      - ''
      - '<#8c8c8c>Cost: <#e3b341>2 credits'
    traitor-radar-name: '<#d84a4a><bold>Radar'
    traitor-radar-lore:
      - '<#f2f0e6>Tracks the closest target for 30 seconds.'
