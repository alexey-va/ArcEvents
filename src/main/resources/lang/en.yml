queue:
  joined: |-
    <prefix> <#55ff88>Your queue place is confirmed.
    <#8c8c8c>   Roster: <#ffcc33><queue>/<minimum>
  already: |-
    <prefix> <#ff9f0f>You are already in this roster.
    <#8c8c8c>   Current status: <#92bed8>/events
  left: |-
    <prefix> <#7bd88f>You left the queue.
    <#8c8c8c>   Your place has been released.
  not-queued: |-
    <prefix> <#ff9f0f>You have not joined a queue yet.
    <#8c8c8c>   Choose an event: <#92bed8>/events
  leave-reserved: |-
    <prefix> <#ff9f0f>The roster is already locked.
    <#8c8c8c>   Emergency exit: <#32d6ff>/events leave
  unavailable: |-
    <prefix> <#d84a4a>The event is unavailable.
    <#8c8c8c>   Try again a little later.
  full: |-
    <prefix> <#d84a4a>The queue is full.
    <#8c8c8c>   Wait for the current roster to start.
  reserved: '<prefix> <#55ff88>The roster is ready.'
  returned: |-
    <prefix> <#7bd88f>Return complete.
    <#8c8c8c>   You are back on your original server.
  start-requested: |-
    <prefix> <#7bd88f>Start confirmed.
    <#8c8c8c>   The roster is locked.
  start-insufficient: |-
    <prefix> <#ff9f0f>The roster is not ready yet.
    <#8c8c8c>   Wait for enough players to join.
  start-arena-unavailable: |-
    <prefix> <#d84a4a>The arena is not ready.
    <#8c8c8c>   Try starting the event later.
  start-busy: |-
    <prefix> <#ff9f0f>Another match is already active.
    <#8c8c8c>   Wait for it to finish.
  start-recovery-pending: |-
    <prefix> <#ff9f0f>The previous match is still finishing.
    <#8c8c8c>   Restoring player state.
  start-network-failed: |-
    <prefix> <#d84a4a>The network did not confirm the start.
    <#8c8c8c>   Try again a little later.
  start-not-owner: |-
