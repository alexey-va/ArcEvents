    - <#f2f0e6>Send this body’s location to detectives.
    called-name: '<#5fb3ff><bold>Detective notified'
    called-lore:
      - '<#f2f0e6>The coordinates were already sent.'
    roster-name: '<#92bed8><bold>Round roster'
    roster-lore:
    - <#f2f0e6>Compare the revealed role with the roster.
  report:
    title: '<#20252b>Round report'
    summary-name: '<#e3b341><bold>Result'
    summary-lore:
