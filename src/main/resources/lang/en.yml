      - '<#ff9f0f>An unfinished match is recorded as cancelled.'
    reload-name: '<#e3b341><bold>Reload configuration'
    reload-lore:
      - '<#f2f0e6>Validate and apply safe settings.'
      - '<#8c8c8c>Node identity requires a restart.'
    recover-name: '<#c58cff><bold>Retry recovery'
    recover-lore:
      - '<#f2f0e6>Restore every currently available player.'
      - '<#8c8c8c>A record is removed only after verification.'
  shop:
    title: '<#d9d6c8>Role Shop · <credits> cr.'
    credits-name: '<#e3b341><bold>Role credits'
    credits-lore:
      - '<#8c8c8c>Available: <#e3b341><credits>'
      - '<#f2f0e6>Purchases last until the round ends.'
    traitor-blade-name: '<#d84a4a><bold>Traitor Blade'
    traitor-blade-lore:
      - '<#f2f0e6>A heavy concealed melee weapon.'
      - ''
      - '<#8c8c8c>Cost: <#e3b341>2 credits'
    traitor-radar-name: '<#d84a4a><bold>Radar'
    traitor-radar-lore:
      - '<#f2f0e6>Tracks the closest target for 30 seconds.'
      - ''
      - '<#8c8c8c>Cost: <#e3b341>1 credit'
    traitor-smoke-name: '<#d84a4a><bold>Smoke grenade'
    traitor-smoke-lore:
      - '<#f2f0e6>Blinds players around you.'
      - ''
      - '<#8c8c8c>Cost: <#e3b341>1 credit'
    detective-scanner-name: '<#5fb3ff><bold>DNA Scanner'
    detective-scanner-lore:
      - '<#f2f0e6>Extracts the killer direction from a body.'
      - ''
      - '<#8c8c8c>Cost: <#e3b341>1 credit'
