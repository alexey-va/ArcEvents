prefix: '<white></white>'
command:
  player-only: '<prefix> <#c42323>This command is only available to players.'
  no-permission: '<prefix> <#c42323>You do not have access to this action.'
  help: |-
    <prefix> <#e6fff3>Menu and rules: <#92bed8>/events
    <#8c8c8c>   Queue: <#92bed8>/events join  <#8c8c8c>leave: <#92bed8>/events leave
    <#8c8c8c>   Start roster: <#92bed8>/events start
    <#8c8c8c>   Match: <#92bed8>/events status  <#8c8c8c>roster: <#92bed8>/events roster
    <#8c8c8c>   Shop: <#92bed8>/events shop  <#8c8c8c>report: <#92bed8>/events report
  unknown: '<prefix> <#c42323>Unknown<#8c8c8c>: <#e6fff3><input>'
  failed: |-
    <prefix> <#c42323>Action failed.
    <#8c8c8c>   Reason: <#e6fff3><reason>
  reload-ok: '<prefix> <#2bba43>Configuration and locales reloaded.'
  reload-failed: '<prefix> <#c42323>Reload rejected. See the log.'

reason:
  network: 'the event network is temporarily unavailable'
  contended: 'the queue changed. Try again'
  transfer: 'transfer to the event server failed'
  return-transfer: 'return to the original server failed'

menu:
  main:
    title: '<#20252b>Events'
    ttt-name: '<#e3b341><bold>Hidden Roles'
    ttt-lore:
      - '<#f2f0e6>Find the traitors before'
      - '<#f2f0e6>they eliminate the innocent team.'
      - ''
      - '<#e3b341><bold>Now:'
      - '<#8c8c8c>   <#f2f0e6>Queue<#8c8c8c>: <#e3b341><queue><#8c8c8c>/<#e3b341><minimum>'
      - '<#8c8c8c>   <#f2f0e6>Arena<#8c8c8c>: <arena_state>'
      - ''
      - '<#8c8c8c>[<#e3b341>▶<#8c8c8c>] <#e3b341>Click<#f2f0e6> — open event'
    stats-name: '<#d6a8ff><bold>Your statistics'
    stats-lore:
      - '<#f2f0e6>Your results across every event.'
      - ''
      - '<#8c8c8c>[<#d6a8ff>▶<#8c8c8c>] <#d6a8ff>Click<#f2f0e6> — view results'
    help-name: '<#92bed8><bold>Help'
    help-lore:
      - '<#f2f0e6>Rules, roles, evidence, and controls.'
      - ''
      - '<#8c8c8c>[<#92bed8>▶<#8c8c8c>] <#92bed8>Click<#f2f0e6> — open help'
    admin-name: '<#c58cff><bold>Event admin panel'
    admin-lore:
      - '<#f2f0e6>Administrators only.'
      - '<#f2f0e6>Network, maps, launch, and recovery.'
      - ''
      - '<#8c8c8c>[<#c58cff>▶<#8c8c8c>] <#c58cff>Click<#f2f0e6> — open'
  event:
    title: '<#20252b>Hidden Roles'
    overview-name: '<#e3b341><bold>About this event'
    overview-lore:
      - '<#f2f0e6>Innocents and detectives hunt traitors'
      - '<#f2f0e6>hidden among their team.'
      - ''
      - '<#e3b341><bold>Now:'
      - '<#8c8c8c>   <#f2f0e6>Queue<#8c8c8c>: <#e3b341><queue><#8c8c8c>/<#e3b341><minimum>'
      - '<#8c8c8c>   <#f2f0e6>Arena<#8c8c8c>: <arena_state>'
    queue-name: '<#5fb3ff><bold>Your participation'
    queue-lore:
      - '<#f2f0e6>The roster forms automatically.'
      - ''
      - '<#5fb3ff><bold>Information:'
      - '<#8c8c8c>   <#f2f0e6>Your status<#8c8c8c>: <queue_state>'
      - '<#8c8c8c>   <#f2f0e6>Roster<#8c8c8c>: <#e3b341><queue><#8c8c8c>/<#e3b341><minimum>'
    join-name: '<#7bd88f><bold>Join the queue'
    join-lore:
      - '<#f2f0e6>Take a place in the next roster.'
      - ''
      - '<#8c8c8c>[<#7bd88f>▶<#8c8c8c>] <#7bd88f>Click<#f2f0e6> — join the queue'
    join-unavailable-name: '<#8c8c8c><bold>Queue unavailable'
    join-unavailable-lore:
      - '<#f2f0e6>The event is not accepting players yet.'
      - '<#969696>Open this menu again a little later.'
    leave-name: '<#d84a4a><bold>Leave the queue'
    leave-lore:
      - '<#f2f0e6>Your place will be released immediately.'
      - ''
      - '<#8c8c8c>[<#d84a4a>▶<#8c8c8c>] <#d84a4a>Click<#f2f0e6> — leave the queue'
    start-name: '<#7bd88f><bold>Start the event'
    start-lore:
      - '<#f2f0e6>Start a match with the ready roster.'
      - '<#8c8c8c>Players<#8c8c8c>: <#e3b341><queue><#8c8c8c>/<#e3b341><minimum>'
      - ''
      - '<#8c8c8c>[<#7bd88f>▶<#8c8c8c>] <#7bd88f>Click<#f2f0e6> — start'
    arena-name: '<#92bed8>Choose a map'
    arena-lore:
      - '<#f2f0e6>Next-round map: <selected_arena><#f2f0e6>.'
      - '<#8c8c8c>The roster creator controls this choice.'
      - ''
      - '<#8c8c8c>[<#92bed8>▶<#8c8c8c>] <#92bed8>Click<#f2f0e6> — open maps'
    roster-name: '<#92bed8><bold>Round roster'
    roster-lore:
      - '<#f2f0e6>Living, missing, and discovered players.'
      - '<#f2f0e6>Hidden roles appear through evidence.'
      - ''
      - '<#8c8c8c>[<#92bed8>▶<#8c8c8c>] <#92bed8>Click<#f2f0e6> — open roster'
    shop-name: '<#ff9f0f><bold>Role shop'
    shop-lore:
      - '<#f2f0e6>Traitor equipment'
      - '<#f2f0e6>and detective tools.'
      - ''
      - '<#8c8c8c>[<#ff9f0f>▶<#8c8c8c>] <#ff9f0f>Click<#f2f0e6> — open shop'
    report-name: '<#e3b341><bold>Round report'
    report-lore:
      - '<#f2f0e6>Roles, damage, and the combat log.'
      - ''
      - '<#8c8c8c>[<#e3b341>▶<#8c8c8c>] <#e3b341>Click<#f2f0e6> — open report'
    help-name: '<#92bed8><bold>Event rules'
    help-lore:
      - '<#f2f0e6>Roles, round flow, weapons, and evidence.'
      - ''
      - '<#8c8c8c>[<#92bed8>▶<#8c8c8c>] <#92bed8>Click<#f2f0e6> — open help'
    evacuate-name: '<#d84a4a><bold>Leave event now'
    evacuate-lore:
      - '<#f2f0e6>Leave the current round immediately.'
      - '<#f2f0e6>Your inventory and previous location are restored.'
      - ''
      - '<#8c8c8c>[<#d84a4a>▶<#8c8c8c>] <#d84a4a>Click<#f2f0e6> — evacuate'
    state:
      queued: '<#7bd88f>queued'
      reserved: '<#e3b341>roster found'
      arrived: '<#5fb3ff>preparing for match'
      matched: '<#7bd88f>in match'
      return_pending: '<#ff9f0f>returning after match'
  stats:
    title: '<#20252b>Event Statistics'
    summary-name: '<#d6a8ff><bold>Your results'
    summary-lore:
      - '<#f2f0e6>Combined results across every event.'
      - ''
      - '<#d6a8ff><bold>Information:'
      - '<#8c8c8c>   <#f2f0e6>Matches<#8c8c8c>: <#f2f0e6><matches>'
      - '<#8c8c8c>   <#f2f0e6>Wins<#8c8c8c>: <#7bd88f><wins>'
