  no-permission: '<prefix> <#c42323>You do not have access to this action.'
  help: '<prefix> <#e6fff3>Menu and rules: <#92bed8>/events<#e6fff3>.<newline><#666666>• <#e6fff3>Queue: <#92bed8>/events join<#8c8c8c> • <#e6fff3>leave: <#92bed8>/events leave<newline><#666666>• <#e6fff3>Match: <#92bed8>/events status<#8c8c8c> • <#e6fff3>shop: <#92bed8>/events shop'
