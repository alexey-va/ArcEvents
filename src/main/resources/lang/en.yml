prefix: '<white></white>'
command:
  player-only: '<prefix> <#c42323>This command is only available to players.'
  no-permission: '<prefix> <#c42323>You do not have access to this action.'
  help: |-
    <prefix> <#e6fff3>Menu and rules: <#92bed8>/arcevents
    <#8c8c8c>   Queue: <#92bed8>/arcevents join  <#8c8c8c>leave: <#92bed8>/arcevents leave
    <#8c8c8c>   Start roster: <#92bed8>/arcevents start
    <#8c8c8c>   Match: <#92bed8>/arcevents status  <#8c8c8c>roster: <#92bed8>/arcevents roster
    <#8c8c8c>   Shop: <#92bed8>/arcevents shop  <#8c8c8c>report: <#92bed8>/arcevents report
    <#e8dfd2>   Zombies, solo or team: <#92bed8>/arcevents zombies
  unknown: '<prefix> <#c42323>Unknown<#8c8c8c>: <#e6fff3><input>'
  failed: '<prefix> <#ff6b61>Could not complete: <#e8dfd2><reason>'
  reload-ok: '<prefix> <#2bba43>Configuration and locales reloaded.'
  reload-failed: '<prefix> <#c42323>Reload rejected. See the log.'

reason:
  network: 'the event network is temporarily unavailable'
  contended: 'the queue changed. Try again'
  transfer: 'transfer to the event server failed'
  return-transfer: 'return to the original server failed'

menu:
  main:
    title: '<#20252b>Events'
    main-body:
    - '<#e8dfd2>Queued: <#ffffff><queue>'
    ttt-name: '<#e3b341><bold>Hidden Roles'
    ttt-lore:
    - <#e8dfd2>Find the traitors among the players.
    - <#e8dfd2>Hidden roles · team investigation
    stats-name: <#c4a7e7>Statistics
    stats-lore:
    - <#e8dfd2>Your matches, wins and karma.
    help-name: <#86dcf1>Rules
    help-lore:
    - <#e8dfd2>Choose a mode and learn how to play.
    admin-name: <#ffffff>Administration
    admin-lore:
    - <#e8dfd2>Matches, maps and player recovery.
  event:
    title: '<#20252b>Hidden Roles'
    loading-name: <#ffb277>Queue
    loading-lore:
    - <#e8dfd2>Checking available actions…
    overview-name: <#ffb277>Find the traitors
    overview-lore:
    - <#e8dfd2>Innocents and detectives face hidden traitors.
    queue-name: <#86dcf1>Your status
    queue-lore:
    - <#e8dfd2><queue_state>
    join-name: <#9bd48d>Join queue
    join-lore:
    - <#e8dfd2>Take a place in the next match.
    join-unavailable-name: '<#8c8c8c><bold>Queue unavailable'
    join-unavailable-lore:
    - <#e8dfd2>The queue is temporarily unavailable. Try again later.
    leave-name: <#ff6b61>Leave queue
    leave-lore:
    - <#e8dfd2>Give up your place.
    start-name: <#9bd48d>Start match
    start-lore:
    - <#e8dfd2>Start with <queue> players. At least <minimum> required.
    arena-name: <#ffffff>Choose map
    arena-lore:
    - '<#e8dfd2>Next map: <selected_arena>.'
    roster-name: <#ffffff>Players
    roster-lore:
    - <#e8dfd2>Who is alive and whose role has been revealed.
    shop-name: <#ffffff>Role equipment
    shop-lore:
    - <#e8dfd2>Equipment bought with this round’s credits.
    report-name: <#ffffff>Match results
    report-lore:
    - <#e8dfd2>Winner, roles and player results.
    help-name: <#ffffff>Rules
    help-lore:
    - <#e8dfd2>Roles, evidence and controls.
    evacuate-name: <#ff6b61>Leave match
    evacuate-lore:
    - <#e8dfd2>Leave the round and restore your previous player state.
    state:
      queued: '<#7bd88f>queued'
      reserved: '<#e3b341>roster found'
      arrived: '<#5fb3ff>preparing for match'
      matched: '<#7bd88f>in match'
      return_pending: '<#ff9f0f>returning after match'
  stats:
    title: '<#20252b>Event Statistics'
    summary-name: '<#d6a8ff><bold>Your results'
    summary-lore:
    - '<#e8dfd2>Matches: <#ffffff><matches>   <#9bd48d>Wins: <wins>'
    - '<#e8dfd2>Kills: <#ffffff><kills>   Deaths: <deaths>'
    - '<#e8dfd2>Karma: <#86dcf1><karma>'
  help:
    title: '<#20252b>Hidden Roles Rules'
    innocent-name: '<#7bd88f><bold>Innocent'
    innocent-lore:
      - '<#f2f0e6>Survive, observe, and inspect bodies.'
      - '<#f2f0e6>Do not trust accusations without evidence.'
    traitor-name: '<#d84a4a><bold>Traitor'
    traitor-lore:
      - '<#f2f0e6>Eliminate innocents without losing cover.'
      - '<#f2f0e6>Only your team knows its allies.'
    detective-name: '<#5fb3ff><bold>Detective'
    detective-lore:
      - '<#f2f0e6>Your role is public to every player.'
      - '<#f2f0e6>Inspect bodies and lead the investigation.'
    flow-name: '<#e3b341><bold>Round flow'
    flow-lore:
      - '<#f2f0e6>Preparation: explore the map and collect weapons.'
      - '<#f2f0e6>Roles stay hidden and all damage is disabled.'
      - '<#f2f0e6>Your role is revealed before the combat countdown.'
      - '<#8c8c8c>Normal chat reaches nearby players.'
      - '<#8c8c8c>Eliminated players hear spectators only.'
    evidence-name: '<#e3b341><bold>Bodies and evidence'
    evidence-lore:
      - '<#f2f0e6>Right-click a body to reveal its role.'
      - '<#f2f0e6>A DNA scanner points toward the killer.'
    weapons-name: '<#ff9f0f><bold>Weapons on the map'
    weapons-lore:
      - '<#f2f0e6>Different firearms are distributed across the map.'
      - '<#f2f0e6>The number of placements depends on the arena.'
      - '<#8c8c8c>The loot effect pattern signals its rarity.'
      - ''
      - '<#8c8c8c>LMB — fire <#8c8c8c>F — reload'
    controls-name: '<#92bed8><bold>Commands'
    controls-lore:
    - <#86dcf1>/arcevents<#e8dfd2> — match menu
    - <#86dcf1>/arcevents team message<#e8dfd2> — role chat
    - <#86dcf1>/arcevents spawn<#e8dfd2> — map spawn
  admin:
    title: '<#20252b>Event Admin Panel'
    status-name: '<#5fb3ff><bold>Current status'
    status-lore:
      - '<#8c8c8c>Phase: <#f2f0e6><phase>'
      - '<#8c8c8c>Match: <#f2f0e6><match>'
      - '<#8c8c8c>Queue: <#f2f0e6><queue>'
      - '<#8c8c8c>Recoveries: <#f2f0e6><recovery>'
      - ''
      - '<#5fb3ff><bold>Network:'
      - '<#8c8c8c>   <#f2f0e6>Node<#8c8c8c>: <#f2f0e6><server> <#8c8c8c>(<node_mode><#8c8c8c>)'
      - '<#8c8c8c>   <#f2f0e6>Host<#8c8c8c>: <#f2f0e6><host>'
      - '<#8c8c8c>   <#f2f0e6>Status<#8c8c8c>: <network_state>'
    arenas-name: '<#92bed8><bold>Round maps'
    arenas-lore:
    - '<#8c8c8c>Ready maps: <#f2f0e6><arenas>'
    - '<#8c8c8c>Current: <active>'
    start-name: '<#7bd88f><bold>Start from queue'
    start-lore:
    - <#f2f0e6>Add you and start a ready roster.
    - <#8c8c8c>The request works from any network server.
    stop-name: '<#d84a4a><bold>Stop the match'
    stop-lore:
    - <#f2f0e6>End the round and restore every player.
    - <#ff9f0f>An unfinished match is recorded as cancelled.
    reload-name: '<#e3b341><bold>Reload configuration'
    reload-lore:
    - <#f2f0e6>Validate and apply safe settings.
    - <#8c8c8c>Node identity requires a restart.
    recover-name: '<#c58cff><bold>Retry recovery'
    recover-lore:
    - <#f2f0e6>Restore every currently available player.
    - <#8c8c8c>A record is removed only after verification.
  arenas:
    title: '<#20252b>Hidden Roles Maps'
    entry-name: '<arena>'
    entry-lore:
    - '<#8c8c8c>Status: <state>'
    - '<#8c8c8c>World: <#f2f0e6><world>'
    - '<#8c8c8c>Template: <#f2f0e6><template>'
    auto-name: '<#e3b341><bold>Automatic rotation'
    auto-lore:
    - <#e8dfd2>The server selects a ready map for the next match.
  event-arenas:
    title: '<#20252b>Next-Round Map'
    entry-name: '<arena>'
    entry-lore:
    - '<#8c8c8c>Selection: <selection>'
    auto-name: '<#e3b341>Automatic rotation'
    auto-lore:
    - <#f2f0e6>The server chooses an available map automatically.
  shop:
    title: '<#20252b>Role Shop — <credits> cr.'
