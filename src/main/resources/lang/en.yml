  apocalypse-overview: '<#c4d58b>Search the bunker and find your way to the surface.'
  apocalypse-facts: '<#e8dfd2>Shared world · Your progress carries over'
  rules-apocalypse-0:
  - '<#c4d58b>Starting bunker'
  - '<#e8dfd2>Follow the corridor to the supplies. Take the shaft ladder up.'
  - ''
  - '<#c4d58b>On the surface'
  - '<#e8dfd2>Search cities for gear and find shelter before the horde arrives.'
  - '<#e8dfd2>Your field guide points to nearby landmarks.'
  - ''
  - '<#c4d58b>Return'
  - '<#e8dfd2>/arcevents leave saves your expedition and takes you back.'
  rules-ttt-0:
  - <#9bd48d>Innocent
  - <#e8dfd2>Survive and use evidence to find the traitors.
  - ''
  - <#ff6b61>Traitor
  - <#e8dfd2>Eliminate the innocents. Only your team knows your allies.
  - ''
  - <#86dcf1>Detective
  - <#e8dfd2>Your role is public. Inspect bodies and protect innocents.
  rules-ttt-1:
  - <#c4abff>Before combat
  - <#e8dfd2>Learn your role. Combat unlocks after the countdown.
  - ''
  - <#c4abff>During combat
  - <#e8dfd2>LMB — fire · RMB — aim · F — reload.
  - '<#e8dfd2>RMB a body to inspect it. Role equipment: /arcevents.'
  - ''
  - <#c4abff>Communication
  - <#e8dfd2>Chat is local. /arcevents team is your role’s team chat.
  - <#e8dfd2>Spectators have a separate chat. Keep hidden roles secret.
  rules-gungame-0:
  - <#f4c575>Goal
  - <#e8dfd2>Eliminate a player with each weapon, then with the knife.
  - ''
  - <#f4c575>Controls
  - <#e8dfd2>LMB — fire · RMB — aim · F — reload.
  - ''
  - <#f4c575>Respawning
  - <#e8dfd2>After elimination, return with brief spawn protection.
  rules-disasters-0:
  - <#9fc6ff>Goal
  - <#e8dfd2>Earn one point for each of the <rounds> rounds you survive.
  - ''
  - <#9fc6ff>How to survive
  - '<#e8dfd2>A meteor lands inside the ring of fire. Step outside it.'
  - '<#e8dfd2>Lightning hits the strip between the sparks. Step aside or under a roof.'
  - '<#e8dfd2>The fog rises twice. Take the stairs to the lookout.'
  rules-fishing-0:
  - <#74ded2>Fish → fight → upgrade
  - <#e8dfd2>Cast by the pier. Hold your catch and RMB the ground.
  - <#e8dfd2>On the first island the catch flees. On later islands dodge its lunges.
  - <#e8dfd2>Chase it, strike with LMB, then sell your catch to the trader.
  - ''
  - <#74ded2>Unlock the next island
  - <#e8dfd2>Complete the trader’s task and claim the boss bait.
  - <#e8dfd2>Catch the boss, defeat it and hand in its trophy.
  - ''
  - <#e8dfd2>Purchases and tokens last for this expedition only.
  rules-zombies-0:
  - <#ff9c82>Hold the sector
  - <#e8dfd2>Survive <waves> waves with <minimum>–<maximum> players.
  - <#e8dfd2>Spend kill and wave points at the entrance stations.
  - ''
  - <#ff9c82>Mystery box
  - <#e8dfd2>RMB to pay for a roll. Claim your weapon before it expires.
  - <#e8dfd2>Unclaimed weapons do not refund the points.
  - ''
  - <#ff9c82>Barricades
  - <#e8dfd2>Hold Shift at a window to replace boards. Repairs are free.
  rules-zombies-1:
  - <#ff9c82>Controls
  - <#e8dfd2>LMB — fire · RMB — aim · F — reload.
  - <#e8dfd2>Knife in slot two. Get out of the Brute’s marked circle.
  - ''
  - <#9bd48d>Help your team
  - <#e8dfd2>Hold Shift near a downed teammate for 3 seconds to revive.
  - <#e8dfd2>You have 25 seconds. Solo players get one self-revive.
  - ''
  - <#9bd48d>Breather
  - <#e8dfd2>Between waves, eliminated players return and ammo refills.
  - <#e8dfd2>Health starts regenerating after 6 seconds without damage.
  working: <#e8dfd2>Updating participation…
