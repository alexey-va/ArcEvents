    join-lore:
      - '<#f2f0e6>The match is hosted on parkour.'
      - '<#f2f0e6>We will transfer you when a roster is ready.'
      - ''
      - '<#666666>• <#7bd88f>Click<#f2f0e6> to join <#666666>•'
