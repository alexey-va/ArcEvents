      - '<#8c8c8c>   <#f2f0e6>Deaths<#8c8c8c>: <#d84a4a><deaths>'
      - '<#8c8c8c>   <#f2f0e6>Karma<#8c8c8c>: <#5fb3ff><karma>'
  help:
    title: '<#20252b>Hidden Roles Rules'
    innocent-name: '<#7bd88f><bold>Innocent'
    innocent-lore:
      - '<#f2f0e6>Survive, observe, and inspect bodies.'
      - '<#f2f0e6>Do not trust accusations without evidence.'
    traitor-name: '<#d84a4a><bold>Traitor'
    traitor-lore:
      - '<#f2f0e6>Eliminate innocents without losing cover.'
      - '<#f2f0e6>Only your team knows its allies.'
    detective-name: '<#5fb3ff><bold>Detective'
    detective-lore:
      - '<#f2f0e6>Your role is public to every player.'
      - '<#f2f0e6>Inspect bodies and lead the investigation.'
    flow-name: '<#e3b341><bold>Round flow'
    flow-lore:
      - '<#f2f0e6>Preparation: explore the map and collect weapons.'
      - '<#f2f0e6>Roles stay hidden and all damage is disabled.'
      - '<#f2f0e6>Your role is revealed before the combat countdown.'
    evidence-name: '<#e3b341><bold>Bodies and evidence'
    evidence-lore:
      - '<#f2f0e6>Right-click a body to reveal its role.'
      - '<#f2f0e6>A DNA scanner points toward the killer.'
    weapons-name: '<#ff9f0f><bold>Weapons on the map'
    weapons-lore:
      - '<#f2f0e6>Different firearms are distributed across the map.'
      - '<#f2f0e6>The number of placements depends on the arena.'
      - '<#8c8c8c>The loot effect pattern signals its rarity.'
      - ''
      - '<#8c8c8c>Right-click — fire <#8c8c8c>F — reload'
    controls-name: '<#92bed8><bold>Commands'
    controls-lore:
      - '<#8c8c8c>/events shop <#f2f0e6>— role shop'
      - '<#8c8c8c>/events team [text] <#f2f0e6>— team chat'
      - '<#8c8c8c>/events status <#f2f0e6>— match status'
      - '<#8c8c8c>/events leave <#f2f0e6>— leave the event immediately'
      - '<#8c8c8c>/events spawn <#f2f0e6>— return to the map spawn'
  admin:
    title: '<#20252b>Event Admin Panel'
    status-name: '<#5fb3ff><bold>Current status'
    status-lore:
      - '<#8c8c8c>Phase: <#f2f0e6><phase>'
      - '<#8c8c8c>Match: <#f2f0e6><match>'
      - '<#8c8c8c>Queue: <#f2f0e6><queue>'
      - '<#8c8c8c>Recoveries: <#f2f0e6><recovery>'
      - ''
      - '<#5fb3ff><bold>Network:'
      - '<#8c8c8c>   <#f2f0e6>Node<#8c8c8c>: <#f2f0e6><server> <#8c8c8c>(<node_mode><#8c8c8c>)'
      - '<#8c8c8c>   <#f2f0e6>Host<#8c8c8c>: <#f2f0e6><host>'
      - '<#8c8c8c>   <#f2f0e6>Status<#8c8c8c>: <network_state>'
    arenas-name: '<#92bed8><bold>Round maps'
    arenas-lore:
      - '<#8c8c8c>Ready maps: <#f2f0e6><arenas>'
      - '<#8c8c8c>Current: <active>'
      - ''
      - '<#92bed8>Click<#f2f0e6> to choose the next map'
    start-name: '<#7bd88f><bold>Start from queue'
    start-lore:
      - '<#f2f0e6>Add you and start a ready roster.'
      - '<#8c8c8c>The request works from any network server.'
    stop-name: '<#d84a4a><bold>Stop the match'
    stop-lore:
      - '<#f2f0e6>End the round and restore every player.'
      - '<#ff9f0f>An unfinished match is recorded as cancelled.'
    reload-name: '<#e3b341><bold>Reload configuration'
    reload-lore:
      - '<#f2f0e6>Validate and apply safe settings.'
      - '<#8c8c8c>Node identity requires a restart.'
    recover-name: '<#c58cff><bold>Retry recovery'
    recover-lore:
      - '<#f2f0e6>Restore every currently available player.'
      - '<#8c8c8c>A record is removed only after verification.'
  arenas:
    title: '<#20252b>Hidden Roles Maps'
    entry-name: '<arena>'
    entry-lore:
