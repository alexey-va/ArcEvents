      - '<#f2f0e6>Disappears after a successful strike.'
      - ''
      - '<#8c8c8c>Cost: <#e3b341>2 credits'
    traitor-radar-name: '<#d84a4a><bold>Radar'
    traitor-radar-lore:
      - '<#f2f0e6>Tracks the closest target for 30 seconds.'
      - ''
      - '<#8c8c8c>Cost: <#e3b341>1 credit'
    traitor-smoke-name: '<#d84a4a><bold>Smoke grenade'
    traitor-smoke-lore:
      - '<#f2f0e6>Right-click to throw an eight-second cloud.'
      - '<#f2f0e6>Blinds every player inside its radius.'
      - ''
      - '<#8c8c8c>Cost: <#e3b341>1 credit'
    detective-scanner-name: '<#5fb3ff><bold>DNA Scanner'
    detective-scanner-lore:
      - '<#f2f0e6>Extracts the killer direction from a body.'
      - ''
      - '<#8c8c8c>Cost: <#e3b341>1 credit'
    detective-medkit-name: '<#5fb3ff><bold>Medkit'
    detective-medkit-lore:
      - '<#f2f0e6>Restores the detective’s health.'
      - ''
      - '<#8c8c8c>Cost: <#e3b341>1 credit'
    detective-armor-name: '<#5fb3ff><bold>Body armor'
    detective-armor-lore:
      - '<#f2f0e6>Provides extra protection for the round.'
      - ''
      - '<#8c8c8c>Cost: <#e3b341>1 credit'
    unavailable-name: '<#8c8c8c><bold>No available items'
    unavailable-lore:
      - '<#f2f0e6>Innocents do not have a role shop.'
  common:
    back-name: '<#ffffff>‹ Back'
    close-name: '<#ffffff>Close'
    unavailable-prefix: '<#ffffff>[Unavailable] '
    close-lore:
    - <#e8dfd2>Close this menu.
    back-lore:
      - '<#e8dfd2>Return to the previous menu.'
    previous-name: <#86dcf1>‹ Previous page
    previous-lore:
    - <#f2f0e6>Show newer records.
    next-name: <#86dcf1>Next page ›
    next-lore:
    - <#f2f0e6>Show older records.
  roster:
    title: '<#20252b>Round roster'
    player-name: '<#f2f0e6><player>'
    player-lore:
    - '<#e8dfd2><status> · Role: <role>'
  body:
    title: '<#20252b>Body inspection'
    victim-name: '<#f2f0e6><player>'
    victim-lore:
