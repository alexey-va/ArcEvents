      - ''
      - '<#8c8c8c>Cost: <#e3b341>1 credit'
    detective-scanner-name: '<#5fb3ff><bold>DNA Scanner'
    detective-scanner-lore:
      - '<#f2f0e6>Extracts the killer direction from a body.'
      - ''
      - '<#8c8c8c>Cost: <#e3b341>1 credit'
    detective-medkit-name: '<#5fb3ff><bold>Medkit'
    detective-medkit-lore:
      - '<#f2f0e6>Restores the detective’s health.'
      - ''
      - '<#8c8c8c>Cost: <#e3b341>1 credit'
    detective-armor-name: '<#5fb3ff><bold>Body armor'
    detective-armor-lore:
