limitations:
- Source-driven offline Minecraft renders. Not native client observation. Legacy inventories
  are retained for older clients.
- 'Legacy root omitted: shared item renderer cannot render the real ZOMBIE_HEAD item.
  Exact native root is in the companion native-ui preview.'
- Head-dependent legacy screens also reference a removed historical preview model;
  no substitute icon is used. The selected head-free inventories use their actual
  current items.
