name: CI

on:
  push:
    branches: [main]
    paths-ignore: [docs/**, '**/*.md', .agents/**, .codex/**]
  pull_request:
    paths-ignore: [docs/**, '**/*.md', .agents/**, .codex/**]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: ./gradlew --no-daemon test shadowJar --build-cache
      - name: Verify consumer artifact ownership
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/ArcEvents-*.jar)
          for jar in "${jars[@]}"; do
            [[ "$jar" == *-plain.jar ]] || python3 scripts/verify-shadow-jar.py "$jar"
          done
      - name: Retain production plugin JAR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ArcEvents-${{ github.sha }}
          retention-days: 7
          if-no-files-found: error
          path: |
            build/libs/ArcEvents-*.jar
            !build/libs/*-plain.jar

  integration:
    name: Storage integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Verify Docker daemon
        run: docker info
      - run: ./gradlew --no-daemon integrationTest

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_TIMEOUT: "60000"
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check out ARC runtime
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: alexey-va/ARC
          ref: 560ccd424d82c0c5e3c70daeb1ddc8c47837c90a
          path: e2e-arc
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Download the pinned standalone provider
        shell: bash
        run: |
          mkdir -p build/e2e-runtime
          curl --fail --location --retry 3 --output build/e2e-runtime/ArcCore-0.1.12.jar https://repo.rus-crafting.ru/grocermc/ru/ruscrafting/ArcCore/0.1.12/ArcCore-0.1.12.jar
          echo '93158072f30ad3d7d5201acdf9036324841c4455844b4f1b650cfea0d8540502  build/e2e-runtime/ArcCore-0.1.12.jar' | sha256sum --check --strict
      - name: Build ARC runtime
        working-directory: e2e-arc
        run: ./gradlew --no-daemon shadowJar
      - name: Configure disposable Redis credentials
        run: docker exec "${{ job.services.redis.id }}" redis-cli CONFIG SET requirepass e2e-secret
      - name: Test ArcEvents on real Paper
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          arc_jar="$(find "$GITHUB_WORKSPACE/e2e-arc/build/libs" -maxdepth 1 -type f -name 'ARC-*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$arc_jar"
          ./gradlew --no-daemon plugwrightTest -Pe2eArcJar="$arc_jar" -Pe2eArcCoreJar=build/e2e-runtime/ArcCore-0.1.12.jar 2>&1 | tee build/plugwright-e2e.log
          git diff --exit-code -- src/test/e2e/package-lock.json
      - name: Test hosted GunGame and TTT on real Paper
        shell: bash
        run: |
          set -o pipefail
          sed -i 's/16379/6379/g' src/test/e2e/fixtures/host-redis.yml
          arc_jar="$(find "$GITHUB_WORKSPACE/e2e-arc/build/libs" -maxdepth 1 -type f -name 'ARC-*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$arc_jar"
          ARC_EVENTS_E2E_HOST=1 ./gradlew --no-daemon plugwrightTest -Pe2eArcJar="$arc_jar" -Pe2eArcCoreJar=build/e2e-runtime/ArcCore-0.1.12.jar 2>&1 | tee build/plugwright-host-e2e.log
          git diff --exit-code -- src/test/e2e-host/package-lock.json
      - name: Upload E2E results and Paper logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: arc-events-paper-e2e
          retention-days: 7
          path: |
            build/plugwright-e2e.log
            build/plugwright-host-e2e.log
            build/plugwright/logs/
            build/plugwright/crash-reports/
            build/plugwright-host/logs/
            build/plugwright-host/crash-reports/
